{% extends "layout.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="fas fa-times-circle text-danger" style="font-size: 4rem;"></i>
                    </div>
                    <h2 class="card-title text-danger">Payment Failed!</h2>
                    <p class="card-text">
                        {% if message %}
                            {{ message }}
                        {% else %}
                            Your payment was not successful. Please try again.
                        {% endif %}
                    </p>
                    <div class="mt-4">
                        <a href="{{ url_for('home') }}" class="btn btn-primary">Return to Home</a>
                        <a href="{{ url_for('checkout') }}" class="btn btn-secondary">Try Again</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
